name: Validate

on:
  push:
    branches:
      - main
      - KIRCH-RAVELIN-F01-FOUNDATION
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: SDK evidence
        run: dotnet --info

      - name: Restore
        run: dotnet restore Ravelin.slnx

      - name: Build
        run: dotnet build Ravelin.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Ravelin.slnx --configuration Release --no-build

      - name: Architecture tests
        run: dotnet test tests/Ravelin.Architecture.Tests/Ravelin.Architecture.Tests.csproj --configuration Release --no-build

      - name: Format verification
        run: dotnet format Ravelin.slnx --verify-no-changes --no-restore
